<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NINJA-SEC | Incidentes</title>
<script src="/portal.js" defer></script>
<main>
  <h1>NINJA-SEC</h1>
  <h2>Gestión de incidentes</h2>
  <form id="incident">
    <p><label>Título <input name="title" maxlength="160" required></label></p>
    <p><label>Descripción <textarea name="description" maxlength="8000" rows="5"></textarea></label></p>
    <p><label>Estado <select name="status">
      <option value="abierto">Abierto</option>
      <option value="en_progreso">En progreso</option>
      <option value="resuelto">Resuelto</option>
    </select></label></p>
    <button type="submit">Guardar</button>
    <button type="reset">Nuevo incidente</button>
  </form>
  <p id="feedback" role="status" aria-live="polite"></p>
  <h2>Incidentes registrados</h2>
  <ul id="incidents"></ul>
</main>
</html>
